{% load static %}
<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Admin{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark sticky-top" style="background-color:#12121a; border-bottom:1px solid #2a2a35;">
    <div class="container">
        <a class="navbar-brand fw-bold" href="{% url 'core:admin_dashboard' %}">
            <span style="color:#ff4d6d;">Shop</span>Wave <small class="text-secondary">Admin</small>
        </a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" href="{% url 'core:admin_dashboard' %}">Dashboard</a></li>
                <li class="nav-item"><a class="nav-link" href="{% url 'products:add_product' %}">Products</a></li>
                <li class="nav-item"><a class="nav-link" href="{% url 'payments:dashboard' %}">
                    Payments <span id="pending-badge" class="badge rounded-pill" style="background-color:#ff4d6d;"></span>
                </a></li>
                <li class="nav-item"><a class="nav-link" href="/admin/orders/order/">Orders</a></li>
            </ul>
            <ul class="navbar-nav">
                <li class="nav-item"><span class="nav-link text-secondary">{{ user.username }}</span></li>
                <li class="nav-item"><a class="nav-link" href="{% url 'accounts:logout' %}">Logout</a></li>
            </ul>
        </div>
    </div>
</nav>

<main class="container py-4">
    {% block content %}
    {% endblock %}
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="{% static 'js/script.js' %}"></script>
</body>
</html>
