{% extends 'base.html' %}
{% block title %}Payment Submitted{% endblock %}

{% block content %}
<div class="text-center py-5">
    <i class="bi bi-hourglass-split" style="font-size:4rem; color:#facc15;"></i>
    <h1 class="fw-bold mt-3">Payment Submitted</h1>
    <p class="text-secondary">Your proof for Order #{{ order.id }} has been received and is pending verification.</p>
    <a href="{% url 'orders:order_detail' order.id %}" class="btn mt-2" style="background-color:#ff4d6d; color:white;">View Order</a>
</div>
{% endblock %}
