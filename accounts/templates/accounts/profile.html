{% extends 'base.html' %}
{% block title %}My Profile{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card p-4">
            <div class="text-center mb-4">
                <i class="bi bi-person-circle" style="font-size:4rem; color:#ff4d6d;"></i>
                <h2 class="fw-bold mt-2">{{ user.username }}</h2>
            </div>

            <ul class="list-group list-group-flush">
                <li class="list-group-item bg-transparent text-white border-secondary d-flex justify-content-between">
                    <span class="text-secondary">Email</span>
                    <span>{{ user.email|default:"—" }}</span>
                </li>
                <li class="list-group-item bg-transparent text-white border-secondary d-flex justify-content-between">
                    <span class="text-secondary">Phone</span>
                    <span>{{ user.phone_number|default:"—" }}</span>
                </li>
                <li class="list-group-item bg-transparent text-white border-secondary d-flex justify-content-between">
                    <span class="text-secondary">Address</span>
                    <span>{{ user.address|default:"—" }}</span>
                </li>
            </ul>

            <div class="d-flex gap-2 mt-4">
                <a href="{% url 'orders:order_history' %}" class="btn btn-outline-light w-100">My Orders</a>
                <a href="{% url 'accounts:logout' %}" class="btn w-100" style="background-color:#ff4d6d; color:white;">Logout</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
