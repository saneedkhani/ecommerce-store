{% load static %}
<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <title>Admin Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body class="d-flex align-items-center justify-content-center" style="min-height:100vh; background-color:#0d0d12;">
    <div class="card p-4" style="width:380px;">
        <h3 class="fw-bold text-center mb-1">Shop<span style="color:#ff4d6d;">Wave</span></h3>
        <p class="text-center text-secondary mb-4">Admin Panel</p>
        <form method="post">
            {% csrf_token %}
            {% if form.non_field_errors %}
                <div class="alert alert-danger py-2">{{ form.non_field_errors }}</div>
            {% endif %}
            {% for field in form %}
                <div class="mb-3">
                    <label class="form-label">{{ field.label }}</label>
                    {{ field }}
                </div>
            {% endfor %}
            <button type="submit" class="btn w-100" style="background-color:#ff4d6d; color:white;">Login</button>
        </form>
    </div>
</body>
</html>
