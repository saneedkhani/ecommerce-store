{% extends 'base.html' %}
{% block title %}Login{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card p-4">
            <h2 class="mb-4 fw-bold">Login</h2>
            <form method="post">
                {% csrf_token %}
                {% for field in form %}
                    <div class="mb-3">
                        <label class="form-label">{{ field.label }}</label>
                        {{ field }}
                        {% if field.errors %}<div class="text-danger small">{{ field.errors }}</div>{% endif %}
                    </div>
                {% endfor %}
                <button type="submit" class="btn w-100" style="background-color:#ff4d6d; color:white;">Login</button>
            </form>
            <p class="text-center mt-3 mb-0 text-secondary">
                Already have no account? <a href="{% url 'accounts:signup' %}">Signup</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
