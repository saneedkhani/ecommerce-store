{% extends 'base.html' %}
{% block title %}Order Placed{% endblock %}

{% block content %}
<div class="text-center py-5">
    <i class="bi bi-check-circle-fill" style="font-size:4rem; color:#4ade80;"></i>
    <h1 class="fw-bold mt-3">Order Placed Successfully!</h1>
    <p class="text-secondary">Order #{{ order.id }} — Total: Rs. {{ order.total_price }}</p>

    <div class="mt-4">
        <a href="{% url 'payments:submit_payment' order.id %}" class="btn me-2" style="background-color:#ff4d6d; color:white;">
            Submit Payment
        </a>
        <a href="{% url 'orders:order_history' %}" class="btn btn-outline-light">View Order History</a>
    </div>
</div>
{% endblock %}
